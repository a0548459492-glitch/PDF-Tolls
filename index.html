<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפיכת PDF לחוברת (Booklet)</title>
    <script src="pdf-lib.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .file-input-wrapper {
            margin: 25px 0;
        }
        input[type="file"] {
            display: none;
        }
        .direction-selector {
            margin: 20px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .direction-selector label {
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>הפיכת קובץ PDF לחוברת</h1>
    <p>העלה קובץ PDF, בחר את כיוון הקריאה של המסמך, והמערכת תסדר מחדש את הדפים בפורמט חוברת להדפסה.</p>

    <div class="file-input-wrapper">
        <label for="pdf-file" class="btn">בחר קובץ PDF</label>
        <input type="file" id="pdf-file" accept="application/pdf">
        <div id="file-name" style="margin-top: 10px; color: #555;"></div>
    </div>

    <div class="direction-selector">
        <label>
            <input type="radio" name="doc-direction" value="rtl" checked>
            עברית (מימין לשמאל)
        </label>
        <label>
            <input type="radio" name="doc-direction" value="ltr">
            אנגלית / שפות לועזיות (משמאל לימין)
        </label>
    </div>

    <button id="process-btn" class="btn" disabled>עבד ויצא לחוברת</button>

    <div id="status"></div>
</div>

<script>
    const fileInput = document.getElementById('pdf-file');
    const fileNameDiv = document.getElementById('file-name');
    const processBtn = document.getElementById('process-btn');
    const statusDiv = document.getElementById('status');

    let uploadedFileArrayBuffer = null;

    // האזנה לבחירת קובץ
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileNameDiv.textContent = `קובץ שנבחר: ${file.name}`;
        statusDiv.textContent = 'טוען קובץ...';
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            uploadedFileArrayBuffer = evt.target.result;
            statusDiv.textContent = 'הקובץ מוכן לעיבוד.';
            processBtn.disabled = false;
        };
        reader.readAsArrayBuffer(file);
    });

    // לוגיקת סידור הדפים לחוברת
    processBtn.addEventListener('click', async () => {
        if (!uploadedFileArrayBuffer) return;

        try {
            statusDiv.textContent = 'מעבד את ה-PDF ומסדר דפים...';
            processBtn.disabled = true;

            // בדיקת כיוון המסמך שנבחר
            const direction = document.querySelector('input[name="doc-direction"]:checked').value;

            // טעינת ה-PDF המקורי ויצירת PDF חדש
            const srcPdfDoc = await PDFLib.PDFDocument.load(uploadedFileArrayBuffer);
            const bookletPdfDoc = await PDFLib.PDFDocument.create();

            let pageCount = srcPdfDoc.getPageCount();
            
            // השלמה למספר דפים שמתחלק ב-4
            const remainder = pageCount % 4;
            const targetPageCount = remainder === 0 ? pageCount : pageCount + (4 - remainder);

            // יצירת מערך אינדקסים (null מייצג דף ריק)
            const pageIndices = [];
            for (let i = 0; i < targetPageCount; i++) {
                if (i < pageCount) {
                    pageIndices.push(i);
                } else {
                    pageIndices.push(null);
                }
            }

            // בניית סדר הדפים לחוברת לפי הכיוון שנבחר
            const bookletOrder = [];
            let left = 0;
            let right = targetPageCount - 1;

            while (left < right) {
                // צמד חיצוני (דפים קיצוניים)
                if (direction === 'rtl') {
                    bookletOrder.push(right); // עמוד אחרון בימין
                    bookletOrder.push(left);  // עמוד ראשון בשמאל
                } else {
                    bookletOrder.push(left);  // עמוד ראשון בשמאל
                    bookletOrder.push(right); // עמוד אחרון בימין
                }
                left++;
                right--;

                // צמד פנימי
                if (left < right) {
                    if (direction === 'rtl') {
                        bookletOrder.push(left);  // עמוד פנימי בימין
                        bookletOrder.push(right); // עמוד פנימי בשמאל
                    } else {
                        bookletOrder.push(right); // עמוד פנימי בשמאל
                        bookletOrder.push(left);  // עמוד פנימי בימין
                    }
                    left++;
                    right--;
                }
            }

            // העתקה ובניית ה-PDF החדש
            for (const origIndex of bookletOrder) {
                if (origIndex !== null && origIndex < pageCount) {
                    const [copiedPage] = await bookletPdfDoc.copyPages(srcPdfDoc, [origIndex]);
                    bookletPdfDoc.addPage(copiedPage);
                } else {
                    // הוספת דף ריק בגודל המסמך
                    let width = 595.28; 
                    let height = 841.89; 
                    if (pageCount > 0) {
                        const firstPage = srcPdfDoc.getPage(0);
                        width = firstPage.getWidth();
                        height = firstPage.getHeight();
                    }
                    bookletPdfDoc.addPage([width, height]);
                }
            }

            // שמירה והורדה
            const pdfBytes = await bookletPdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `booklet_${direction}_ready.pdf`;
            link.click();

            statusDiv.textContent = 'הקובץ עובד בהצלחה והורד למחשב!';
            processBtn.disabled = false;

        } catch (error) {
            console.error(error);
            statusDiv.textContent = 'אירעה שגיאה בעיבוד הקובץ.';
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
